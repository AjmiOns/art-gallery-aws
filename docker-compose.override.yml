# Outils de développement, fusionné automatiquement avec docker-compose.yml.
# Adminer : visualiser et modifier la base dans le navigateur.
#   http://localhost:8080/?pgsql=db&username=gallery&db=art_gallery   (mot de passe : gallery)
services:
  adminer:
    image: adminer:4
    container_name: art-gallery-adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
